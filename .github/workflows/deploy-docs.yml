name: Build Multirepo Docs

on:
  push:
    branches:
      - main
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Central Docs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Устанавливаем MkDocs, тему Material и плагин Multirepo
      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-multirepo-plugin

      # Подменяем URL репозиториев в mkdocs.yml, внедряя секретный токен для авторизации
      - name: Inject Token into Config
        run: |
          sed -i 's|https://github.com/|https://${{ secrets.DOCS_TOKEN }}@github.com/|g' mkdocs.yml

      - name: Build Site
        run: mkdocs build

      - name: Commit and Push to /docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff-index --quiet HEAD || git commit -m "chore: auto-build multirepo site [skip ci]"
          git push origin main
