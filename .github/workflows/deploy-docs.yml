name: Build Multirepo Docs

on:
  push:
    branches:
      - main
  workflow_dispatch: 
  repository_dispatch:
    types: [update_docs]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Central Docs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-multirepo-plugin

      - name: Inject Token into Config
        run: |
          sed -i 's|https://github.com/|https://${{ secrets.DOCS_TOKEN }}@github.com/|g' mkdocs.yml

      # СОЗДАЕМ ВРЕМЕННУЮ ПАПКУ, ЧТОБЫ МКDOCS НЕ ПАДАЛ С ОШИБКОЙ
      - name: Create Temporary Docs Dir
        run: mkdir -p temp_empty_docs

      # Собираем сайт с флагом --clean, указывая папку вывода (site-dir) строго в docs
      - name: Build Site
        run: mkdocs build --clean --site-dir docs

      - name: Commit and Push to /docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff-index --quiet HEAD || git commit -m "chore: auto-build multirepo site [skip ci]"
          git push origin main
