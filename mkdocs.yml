site_name: "ДИТ. Проекты. Документация"
site_url: ""

nav:
  - Портал: index.md

  - Проекты:
      - DocGen: docgen/index_01.md
      - Test: project-test/index_02.md
      
use_directory_urls: false

theme:
  name: material
  language: ru

  logo: assets/logo.svg
  favicon: assets/favicon.ico

  font:
    text: Inter
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.tabs.link

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Перейти на тёмную тему

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Перейти на светлую тему

plugins:
  - search
  - print-site

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/openapi_injector.py
