site_name: "Единая экосистема проектов"
site_url: ""

use_directory_urls: false

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

  logo: assets/logo.svg
  favicon: assets/favicon.ico  

  # ПОДКЛЮЧЕНИЕ ФИРМЕННЫХ ШРИФТОВ
  font:
    text: Inter          # Шрифт для основного текста
    code: Roboto Mono    # Шрифт для блоков кода

  # ЦВЕТОВАЯ ПАЛИТРА ПО СТИЛЮ ACADEMCITY
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue-grey  # Ближайший стандартный цвет для шапки
      accent: blue        # Цвет для акцентов и ссылок
      toggle:
        icon: material/brightness-7
        name: Перейти на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue-grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Перейти на светлую тему
  
plugins:
  - search
  - scalar-tag
  - print-site
  
# Подключение кастомного CSS для точной подгонки HEX-цветов
extra_css:
  - stylesheets/extra.css
hooks:
  - hooks/openapi_injector.py  # Скрипт автоматизации
